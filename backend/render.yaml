services:
  # Backend Django API
  - type: web
    name: ride-solutions-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # NOTE: preDeployCommand requires a paid instance type — not available on
    # Free. On Free, run migrations as part of startCommand instead: that
    # runs on the live instance, which (unlike buildCommand) is attached to
    # the private network and can resolve internal Postgres hostnames.
    startCommand: >
      bash -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn ridesolutions.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: ridesolutions.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://otobigo.onrender.com,https://ride-solution-backend-udox.onrender.com
      # This database was created outside this Blueprint, so it can't use a
      # fromDatabase reference. Set the actual value in the Render dashboard
      # (Environment tab) using the Internal Database URL — sync: false keeps
      # it out of this file / your repo.
      - key: DATABASE_URL
        sync: false
      # Set the real value in the dashboard instead of committing it here —
      # this password was in source control and should also be rotated.
      - key: EMAIL_PASSWORD
        sync: false

  # Frontend React Static Site
  - type: web
    name: ride-solution
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ride-solution-backend-udox.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html